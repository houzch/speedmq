# SpeedMQ 本地编排
#
#   docker compose up -d --build      # 本地构建并启动
#   docker compose pull && docker compose up -d   # 直接用已发布的镜像，不本地构建
#   docker compose ps                 # 查看状态（含健康检查）
#   docker compose logs -f            # 跟随日志
#   docker compose down               # 停止并删除容器（保留数据卷）
#   docker compose down -v            # 连数据卷一起删除
#
# 设计要点：
#   - 配置以只读方式挂载，改配置后 `docker compose restart` 即可生效，无需重建镜像
#   - 数据目录使用命名卷，容器重建不丢数据（M4 起真正落盘消息与元数据）
#   - 健康检查用管理面端口的 TCP 探测（M5 起有 15672；不用 HTTP 是因为管理 API 需要认证）
#   - 容器内的 guest 需要 remote_access=true（配置里已开，仅供本地开发）：
#     容器收到的连接源是 Docker 网关地址而非 127.0.0.1，不放开会被 403 拒绝
#   - 管理 UI 已内嵌在二进制里（无额外静态服务）：浏览器打开 http://localhost:15672/
#     账号口令同 AMQP（默认 guest/guest）

name: speedmq

services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    # 指向已发布的镜像，这样 `docker compose pull` 能直接拉到；
    # 本地开发用 `docker compose up -d --build` 时会用同名 tag 覆盖它（两个仓库都发布同一份镜像）
    image: houzch/speedmq:1.1.03
    container_name: speedmq

    # 开发环境：异常退出后自动拉起，手动 stop 后不再自动启动
    restart: unless-stopped

    ports:
      - "5672:5672"
      # MQTT 3.1.1（M7 起内置的第二个协议插件；可用 plugins.mqtt.enabled=false 关闭）
      - "1883:1883"
      # 管理面：Management HTTP API + 内嵌管理 UI + /metrics
      - "15672:15672"

    volumes:
      # 配置文件（只读挂载，便于本地修改调试）
      - ./configs/speedmqd.json:/etc/speedmq/speedmqd.json:ro
      # 数据目录（命名卷，避免污染工作区）
      - speedmq-data:/var/lib/speedmq

    # CMD 覆盖：把日志级别调到 debug，便于观察握手与错误路径
    command: ["-config", "/etc/speedmq/speedmqd.json", "-log-level", "debug"]

    healthcheck:
      # 用 busybox nc 探测管理端口：能连上说明内核与监听都就绪
      test: ["CMD", "nc", "-z", "127.0.0.1", "15672"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

    # 单机开发场景下的日志轮转，避免长期运行撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  speedmq-data:
