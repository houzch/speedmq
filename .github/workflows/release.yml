# 发布流水线：推 v* tag 到 GitHub 远端时触发，产出 GitHub Release（多平台二进制归档）与 GHCR 镜像（Packages）。
#
#   git push swiftmq v1.0.0     # 注意：GitHub 远端名是 swiftmq，origin 指向 Gitee
#
# 说明见 docs/ops/release.md。
#
# 平台口径：Linux / Windows / macOS 都在支持范围内（amd64 与 arm64）。
# 容器镜像只出 Linux（不提供 Windows 容器镜像）。详见 docs/ops/release.md。
name: Release

on:
  push:
    tags: ['v*']

# 建 Release 需要 contents: write；推 GHCR 需要 packages: write
permissions:
  contents: write
  packages: write

env:
  # 本仓库解析为 ghcr.io/houzch/swiftmq；GHCR 要求镜像名全小写
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- 1) 交叉编译各平台二进制并打包 ----------
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }   # macOS Intel
          - { goos: darwin,  goarch: arm64 }   # macOS Apple Silicon
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # 需要 32 位或 armv7 时按下面格式加一行即可：
          # - { goos: windows, goarch: 386 }
          # - { goos: linux,   goarch: 386 }
    steps:
      - uses: actions/checkout@v4

      # 先产出 web/dist：web/dist 不入库，缺少它二进制里就没有管理 UI
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # 本仓库零第三方依赖（go.mod 无 require、无 go.sum），模块缓存无意义：
          # 关掉可避免 setup-go 因找不到 go.sum 而打 warning
          cache: false

      # 纯 Go + CGO_ENABLED=0：所有平台都能交叉编译，无需 QEMU / macOS runner
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF#v}"                       # v1.0.0 -> 1.0.0
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

          # 1) 编译两个二进制
          mkdir -p stage
          go build -trimpath -ldflags="-s -w" -o "stage/swiftmqd${ext}"   ./cmd/swiftmqd
          go build -trimpath -ldflags="-s -w" -o "stage/swiftmqctl${ext}" ./cmd/swiftmqctl

          # 2) 归档里附带 README 与 LICENSE，方便下载者直接看用法
          cp README.md LICENSE stage/

          # 3) 打包：Windows 用 zip，其余用 tar.gz
          base="swiftmq-${ver}-${GOOS}-${GOARCH}"
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${base}.zip" .)
          else
            tar -czf "dist/${base}.tar.gz" -C stage .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: swiftmq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # ---------- 2) 汇总归档 + 校验和 + 创建 Release ----------
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SwiftMQ ${GITHUB_REF_NAME}" \
            --generate-notes

  # ---------- 3) 构建多架构镜像并推到 GHCR ----------
  # 容器只出 Linux：本项目不提供 Windows 容器镜像
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"   # v1.0.0 -> 1.0.0
          minor="${version%.*}"            # 1.0.0 -> 1.0
          major="${version%%.*}"           # 1.0.0 -> 1
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:${minor}" \
            -t "${IMAGE}:${major}" \
            -t "${IMAGE}:latest" \
            --push .
