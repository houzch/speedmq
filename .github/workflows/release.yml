# 发布流水线：推 v* tag 到 GitHub 远端时触发，产出 GitHub Release（多平台二进制归档）
# 与多架构容器镜像（GHCR；配置了 Docker Hub 凭据时同时推 Docker Hub）。
#
#   git push swiftmq v1.0.0     # 注意：GitHub 远端名是 swiftmq，origin 指向 Gitee
#
# 说明见 docs/ops/release.md。
#
# 平台口径：Linux / Windows / macOS 都在支持范围内（amd64 与 arm64）。
# 容器镜像只出 Linux（不提供 Windows 容器镜像）。详见 docs/ops/release.md。
name: Release

on:
  push:
    tags: ['v*']

# 建 Release 需要 contents: write；推 GHCR 需要 packages: write
permissions:
  contents: write
  packages: write

env:
  # 本仓库解析为 ghcr.io/houzch/swiftmq；GHCR 要求镜像名全小写
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub 镜像名：命名空间默认 houzch，可用仓库变量 DOCKERHUB_NAMESPACE 覆盖。
  # 是否真的推送由下面"有没有配 DOCKERHUB_TOKEN"决定（没配就跳过，不影响发布）。
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'houzch' }}/swiftmq

jobs:
  # ---------- 1) 交叉编译各平台二进制并打包 ----------
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }   # macOS Intel
          - { goos: darwin,  goarch: arm64 }   # macOS Apple Silicon
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # 需要 32 位或 armv7 时按下面格式加一行即可：
          # - { goos: windows, goarch: 386 }
          # - { goos: linux,   goarch: 386 }
    steps:
      - uses: actions/checkout@v4

      # 先产出 web/dist：web/dist 不入库，缺少它二进制里就没有管理 UI
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # 本仓库零第三方依赖（go.mod 无 require、无 go.sum），模块缓存无意义：
          # 关掉可避免 setup-go 因找不到 go.sum 而打 warning
          cache: false

      # 纯 Go + CGO_ENABLED=0：所有平台都能交叉编译，无需 QEMU / macOS runner
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF#v}"                       # v1.0.0 -> 1.0.0
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

          # 1) 编译两个二进制
          mkdir -p stage
          go build -trimpath -ldflags="-s -w" -o "stage/swiftmqd${ext}"   ./cmd/swiftmqd
          go build -trimpath -ldflags="-s -w" -o "stage/swiftmqctl${ext}" ./cmd/swiftmqctl

          # 2) 归档里附带 README 与 LICENSE，方便下载者直接看用法
          cp README.md LICENSE stage/

          # 3) 打包：Windows 用 zip，其余用 tar.gz
          base="swiftmq-${ver}-${GOOS}-${GOARCH}"
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${base}.zip" .)
          else
            tar -czf "dist/${base}.tar.gz" -C stage .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: swiftmq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # ---------- 2) 汇总归档 + 校验和 + 创建 Release ----------
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SwiftMQ ${GITHUB_REF_NAME}" \
            --generate-notes

  # ---------- 3) 构建多架构镜像并推到公共仓库（GHCR + 可选 Docker Hub）----------
  # 容器只出 Linux：本项目不提供 Windows 容器镜像
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 用 secret 的"有没有配"当开关：secrets 不能直接写在 job 级 if 里，所以在 shell 里判断。
      # 没配 → 只发 GHCR，发布照常成功；配了 → 同时发 Docker Hub。
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 用 :- 兜底：万一变量完全没定义（例如以后有人删掉 env），也不至于因 set -u 直接失败
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "未配置 DOCKERHUB_TOKEN，跳过 Docker Hub 登录与推送"
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME:-}" --password-stdin

      - name: Build and push
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"   # v1.0.0 -> 1.0.0
          minor="${version%.*}"            # 1.0.0 -> 1.0
          major="${version%%.*}"           # 1.0.0 -> 1

          tags=(
            -t "${IMAGE}:${version}"
            -t "${IMAGE}:${minor}"
            -t "${IMAGE}:${major}"
            -t "${IMAGE}:latest"
          )
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            tags+=(
              -t "${DOCKERHUB_IMAGE}:${version}"
              -t "${DOCKERHUB_IMAGE}:${minor}"
              -t "${DOCKERHUB_IMAGE}:${major}"
              -t "${DOCKERHUB_IMAGE}:latest"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --push .
