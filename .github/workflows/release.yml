# 发布流水线：推 v* tag 到 GitHub 远端时触发，产出 GitHub Release（多平台二进制归档）
# 与多架构容器镜像（GHCR；配置了 Docker Hub 凭据时同时推 Docker Hub）。
#
#   git push speedmq v1.1.0     # 注意：GitHub 远端名是 speedmq，origin 指向 Gitee
#                                # tag 必须等于源码里的 broker.Version，否则 verify-version 直接失败
#
# 一次发布的完整步骤：用 go run ./scripts/version <版本> 改齐版本号 → 提交并推送 → 打 tag 推送 → 等 Actions 跑完。
# 版本号由 scripts/version 统一写入（内核常量、npm 元数据、compose/README/docs 与 speedmq-test 镜像 tag）；
# 下面的 verify-version 会对其中 4 个关键处（broker.go / package.json / package-lock.json / docker-compose.yml）做门禁校验。
#
# 平台口径：Linux / Windows / macOS 都在支持范围内（amd64 与 arm64）。
# 容器镜像只出 Linux（不提供 Windows 容器镜像）。
name: Release

on:
  push:
    tags: ['v*']

# 建 Release 需要 contents: write；推 GHCR 需要 packages: write
permissions:
  contents: write
  packages: write

env:
  # 本仓库解析为 ghcr.io/houzch/speedmq；GHCR 要求镜像名全小写
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub 镜像名：命名空间默认 houzch，可用仓库变量 DOCKERHUB_NAMESPACE 覆盖。
  # 是否真的推送由下面"有没有配 DOCKERHUB_TOKEN"决定（没配就跳过，不影响发布）。
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'houzch' }}/speedmq

jobs:
  # ---------- 0) 门禁：tag 必须与源码里的版本号一致 ----------
  # 事故复盘：v1.0.2 与 v1.0.3 曾被先后打在同一提交上，而源码里 broker.Version 始终是 1.0.0，
  # 于是镜像"标签写着 1.0.3、启动日志与 /api/overview 却报 1.0.0"。这一步把版本一致性变成硬门禁，
  # 校验的就是上面注释里那 4 处，避免只改了源码却忘了编排文件。
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与源码版本号
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"          # v1.1.0 -> 1.1.0
          fail=0
          check() {                            # check 名称 实际值
            if [ "$2" != "${want}" ]; then
              echo "::error::$1 = '$2'，与 tag ${GITHUB_REF_NAME} 不一致（应为 ${want}）"
              fail=1
            else
              echo "OK   $1 = $2"
            fi
          }
          check "internal/broker/broker.go" "$(awk -F'"' '/^const Version = /{print $2; exit}' internal/broker/broker.go)"
          check "web/package.json"          "$(grep -m1 -oP '"version":\s*"\K[^"]+' web/package.json)"
          check "web/package-lock.json"     "$(grep -m1 -oP '"version":\s*"\K[^"]+' web/package-lock.json)"
          check "docker-compose.yml"        "$(grep -m1 -oP 'image:\s*\S+:\K[0-9][^ ]*' docker-compose.yml)"

          if [ "${fail}" -ne 0 ]; then
            echo "::error::版本号未统一：把上述 4 处改齐后，删掉该 tag 重新打（不要复用已发布的 tag）"
            exit 1
          fi
          echo "版本号校验通过：${want}"

  # ---------- 1) 交叉编译各平台二进制并打包 ----------
  binaries:
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }   # macOS Intel
          - { goos: darwin,  goarch: arm64 }   # macOS Apple Silicon
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # 需要 32 位或 armv7 时按下面格式加一行即可：
          # - { goos: windows, goarch: 386 }
          # - { goos: linux,   goarch: 386 }
    steps:
      - uses: actions/checkout@v4

      # 先产出 web/dist：web/dist 不入库，缺少它二进制里就没有管理 UI
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # 本仓库零第三方依赖（go.mod 无 require、无 go.sum），模块缓存无意义：
          # 关掉可避免 setup-go 因找不到 go.sum 而打 warning
          cache: false

      # 纯 Go + CGO_ENABLED=0：所有平台都能交叉编译，无需 QEMU / macOS runner
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF#v}"                       # v1.0.0 -> 1.0.0
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

          # 1) 编译两个二进制
          mkdir -p stage
          go build -trimpath -ldflags="-s -w" -o "stage/speedmqd${ext}"   ./cmd/speedmqd
          go build -trimpath -ldflags="-s -w" -o "stage/speedmqctl${ext}" ./cmd/speedmqctl

          # 2) 归档里附带 README 与 LICENSE，方便下载者直接看用法
          cp README.md LICENSE stage/

          # 3) 打包：Windows 用 zip，其余用 tar.gz
          base="speedmq-${ver}-${GOOS}-${GOARCH}"
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${base}.zip" .)
          else
            tar -czf "dist/${base}.tar.gz" -C stage .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: speedmq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # ---------- 2) 汇总归档 + 校验和 + 创建 Release ----------
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SpeedMQ ${GITHUB_REF_NAME}" \
            --generate-notes

  # ---------- 3) 构建多架构镜像并推到公共仓库（GHCR + 可选 Docker Hub）----------
  # 容器只出 Linux：本项目不提供 Windows 容器镜像
  image:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 用 secret 的"有没有配"当开关：secrets 不能直接写在 job 级 if 里，所以在 shell 里判断。
      # 没配 → 只发 GHCR，发布照常成功；配了 → 同时发 Docker Hub。
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 用 :- 兜底：万一变量完全没定义（例如以后有人删掉 env），也不至于因 set -u 直接失败
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "未配置 DOCKERHUB_TOKEN，跳过 Docker Hub 登录与推送"
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME:-}" --password-stdin

      - name: Build and push
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"   # v1.0.0 -> 1.0.0
          minor="${version%.*}"            # 1.0.0 -> 1.0
          major="${version%%.*}"           # 1.0.0 -> 1

          tags=(
            -t "${IMAGE}:${version}"
            -t "${IMAGE}:${minor}"
            -t "${IMAGE}:${major}"
            -t "${IMAGE}:latest"
          )
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            tags+=(
              -t "${DOCKERHUB_IMAGE}:${version}"
              -t "${DOCKERHUB_IMAGE}:${minor}"
              -t "${DOCKERHUB_IMAGE}:${major}"
              -t "${DOCKERHUB_IMAGE}:latest"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --push .
